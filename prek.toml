
# This is the configuration file for prek Git hooks
# See: https://prek.j178.dev/

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer", exclude = "^ci/.*\\.json$" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3" # Ruff version.
hooks = [
    # Run the linter.
    { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi"] },

    # Run the formatter.
    { id = "ruff-format", types_or = ["python", "pyi", "markdown"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.95"
hooks = [{ id = "ty" }]
